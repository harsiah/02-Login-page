<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login Page</title>
    <link rel="stylesheet" href="login.css" />
  </head>
  <body>
    <div class="login-container">
        <div class="app-brand">
          <img src="image/logo ishamart.jpeg" alt="IshaMart System" />
          
        </div>

      <h1>Welcome Back</h1>
      <p>Please login to your account.</p>

      <form>
        <label for="email">Username:</label>
        <input type="email" placeholder="Username" id="email" />

        <label for="password">Password:</label>
        <input type="password" placeholder="Enter your password" id="password"/>
        <button type="submit" id="login-button">Login</button>
      </form>
    </div>


    <p class="signup-text">Don't have an account? <a href="signup.html">Sign up</a></p>

    <p class="forgot-text">Forgot your password? <a href="reset-password.html">Reset it</a></p>
  </body>
</html>
